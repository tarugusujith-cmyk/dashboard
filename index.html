<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Modern Banking Dashboard Application"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the
      // wrong theme, and to stop browsers from auto-inverting the page
      // with their own "force dark" heuristic.
      (function () {
        try {
          var stored = localStorage.getItem("settings-storage");
          var theme = stored ? JSON.parse(stored).state?.settings?.theme : null;
          if (!theme) {
            theme = "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // ignore, default to light
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>BankDash</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
